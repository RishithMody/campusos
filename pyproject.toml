# Shared Python conventions for CampusOS.
#
# Declared here so every agent writing Python -- backend (T2), ML (T4), infra (T3) --
# produces the same style, and so CI does not reformat work it did not ask for.
# Agents must not change this file; it is Orchestrator-owned (see CLAUDE.md).

[tool.ruff]
line-length = 100
target-version = "py311"
# `docs/agents/reviews/**` is excluded outright, not just from the lint rules below:
# a reproduction script is evidence of what was run, and reformatting it changes the
# thing it is evidence of. CI runs `ruff format --check .` over everything else, so
# without this the formatter and that intent contradict each other and CI stays red.
exclude = [".venv", "venv", "node_modules", "frontend", ".git", "docs/agents/reviews"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear: likely bugs and design problems
    "S",    # bandit: security checks -- this project makes privacy claims
    "ASYNC",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, and hardcode obviously-fake credentials in fixtures.
"tests/**" = ["S101", "S105", "S106"]
# CI runner scripts shell out to a known interpreter path on purpose, and generate
# hostile test payloads with the stdlib RNG -- neither is a cryptographic use.
"scripts/ci/**" = ["S110", "S311", "S603", "S606", "S607"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# `gpu` marks tests that need the H200 cluster. CI never runs them: see docs/infra-policy.md.
markers = [
    "gpu: requires the H200 cluster (excluded from CI, needs GPU approval)",
    "privacy: asserts a privacy or disclosure guarantee",
    "authz: asserts an authorization boundary",
]
