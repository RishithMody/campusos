name: campusos-t7a
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: campusos
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
