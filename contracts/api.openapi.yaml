openapi: 3.1.0
info:
  title: CampusOS API
  version: "1.0.0"
  description: |
    The REST surface between the CampusOS backend and its three clients: the Next.js frontend
    (Track 2 visualisation), the Discord group-chat assistant (Track 3), and a Cubbie Skill
    script (Track 1, if it ever calls us).

    Two rules hold on every path, without exception:

    1. **Identity comes from the validated bearer token, never from the request.** No path takes
       a student id as a parameter or body field to decide *who you are*. A `student_ref` in a
       URL identifies a subject to read, and reading another student's subject requires an
       explicit grant; it never establishes the caller.
    2. **Disclosure is applied server-side, on egress.** A response never contains more than the
       caller's disclosure level permits, regardless of what the caller asks for. Clients render
       what they are given; they are not trusted to filter.

    Cubbie's sandbox allows outbound HTTPS on port 443 only, and cannot reach a server started
    inside it. Any Skill-facing deployment is therefore a public HTTPS host. The vLLM endpoint is
    never that host: see docs/adr/0001.
servers:
  - url: https://api.campusos.dev/v1
    description: Production. Versioned in the path so a later change cannot break agents mid-flight.
  - url: http://localhost:8000/v1
    description: Local development, mock inference, no GPU.

security:
  - bearerAuth: []

tags:
  - name: health
  - name: availability
  - name: negotiations
  - name: approvals
  - name: grants
  - name: identity
  - name: channels

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: |
        Authenticated, like every other path. CLAUDE.md section 7 states the rule without an
        exception and this document claims the same, so an unauthenticated /health was simply
        the two contradicting each other. Infrastructure liveness does not need this route:
        container and load-balancer probes use the orchestrator's own healthcheck on the
        internal port, which is never routed publicly. Granting an exception here is a human
        decision and would need an ADR, not a default.
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /me:
    get:
      tags: [identity]
      summary: The calling student's own account view
      description: |
        Returns the caller's durable contact handle: the identifier they share out of band
        (a link, a QR code, a message) so somebody can invite them. It is deliberately NOT a
        `stu_` reference. A `stu_` is minted per negotiation precisely so that two recipients
        cannot join their records together, which means it cannot also be the thing you give
        someone in order to start the first negotiation. The two identifiers have opposite
        lifetimes and this endpoint is where that distinction becomes usable.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                type: object
                required: [contact_handle]
                additionalProperties: false
                properties:
                  contact_handle: { type: string, pattern: "^cnt_[A-Za-z0-9]{16,64}$" }
                  display_name:
                    type: string
                    maxLength: 40
                    description: Chosen by the student. Never derived from an email or legal name.
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [identity]
      summary: Rotate the caller's contact handle
      description: |
        Invalidates the old handle. The escape hatch for a handle that has been shared more
        widely than intended; open negotiations keep their own pseudonyms and are unaffected.
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                required: [contact_handle]
                properties:
                  contact_handle: { type: string, pattern: "^cnt_[A-Za-z0-9]{16,64}$" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/chat:
    post:
      tags: [identity]
      summary: Talk to your own agent, streamed
      description: |
        A student's conversation with the agent that represents them. This never crosses to
        another student: it is the one surface where `note_for_own_student` content is legible,
        and the agent may speak freely here about its own student's calendar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message: { type: string, maxLength: 2000 }
                negotiation_id:
                  type: string
                  pattern: "^neg_[A-Za-z0-9]{16,64}$"
                  description: Optional context, so "why did you say no?" has an antecedent.
      responses:
        "200":
          description: |
            `text/event-stream`. Exactly three event names, every `data:` line a single JSON
            object. Specified to the byte because T2 writes the server and T5 writes the
            client from this document alone, and "token deltas then a terminal event" is
            satisfied by a dozen mutually incompatible framings.

            - **`delta`** — `{"text": "..."}`. Zero or more. Concatenate `text` in order to
              rebuild the reply. Never partial UTF-8: split on character boundaries.
            - **`done`** — `{"message_id": "...", "finish_reason": "stop" | "length" | "cancelled"}`.
              Exactly one, always last on a successful stream.
            - **`error`** — `{"type": "...", "title": "...", "status": 0, "trace_id": "..."}`,
              an RFC 9457 Problem. Terminal: nothing follows it, and no `done` is sent. Used
              for failures *after* the 200 has been written, when no status code is left to
              change — which is where a stream silently truncating gets mistaken for a short
              answer. Carries no private schedule detail, like every other Problem.

            A stream that ends without `done` or `error` is a failure; the client surfaces it
            rather than treating the partial text as the whole reply.

            ```
            event: delta
            data: {"text": "Ben can do Wednesday, "}

            event: delta
            data: {"text": "but not before 11."}

            event: done
            data: {"message_id": "msg_C3d4E5f6G7h8I9j0", "finish_reason": "stop"}
            ```
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames as specified above.
              example: |
                event: delta
                data: {"text": "Ben can do Wednesday."}

                event: done
                data: {"message_id": "msg_C3d4E5f6G7h8I9j0", "finish_reason": "stop"}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/availability:
    put:
      tags: [availability]
      summary: Publish the calling student's availability envelope
      description: |
        The caller submits their own availability, already reduced to the disclosure level they
        chose. The server re-applies the ceiling from the student's standing preference and
        rejects anything above it, rather than trusting the client to have filtered correctly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Availability" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/DisclosureViolation" }

  /negotiations:
    get:
      tags: [negotiations]
      summary: List the caller's negotiations
      description: |
        The dashboard query. `status=converged` is the student's commitments; the default is
        everything they participate in, newest first. Each entry is a summary, not a full
        state document, and is filtered for this caller like everything else.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [gathering, negotiating, awaiting_approval, converged, failed, expired, cancelled]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Summaries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [negotiations]
                additionalProperties: false
                properties:
                  negotiations:
                    type: array
                    items:
                      type: object
                      required: [negotiation_id, status, state_version, updated_at, awaiting_me]
                      additionalProperties: false
                      properties:
                        negotiation_id: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
                        status:
                          type: string
                          enum: [gathering, negotiating, awaiting_approval, converged, failed, expired, cancelled]
                        state_version: { type: integer, minimum: 0 }
                        updated_at: { type: string, format: date-time }
                        awaiting_me:
                          type: boolean
                          description: True when this caller has a pending approval. Lets the dashboard show the student what needs them without fetching every negotiation.
                        agreed_slot:
                          type: object
                          required: [start, end]
                          additionalProperties: false
                          properties:
                            start: { type: string, format: date-time }
                            end: { type: string, format: date-time }
                        title:
                          type: string
                          maxLength: 80
                          description: Set by the creator. Shared with participants, so it is as public as the negotiation itself.
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [negotiations]
      summary: Start a negotiation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitees, window, max_rounds]
              additionalProperties: false
              properties:
                invitees:
                  type: array
                  minItems: 1
                  maxItems: 11
                  description: |
                    Durable contact handles from `GET /me`, obtained out of band. The caller is
                    always a participant and is not listed here. The server resolves each handle
                    to an account, mints a fresh per-negotiation `stu_` pseudonym for every
                    participant including the caller, and returns them in the state document.
                    Clients never mint or reuse a `stu_`: reusing one across negotiations is
                    exactly the correlation the pseudonyms exist to prevent.
                  items: { type: string, pattern: "^cnt_[A-Za-z0-9]{16,64}$" }
                title: { type: string, maxLength: 80 }
                window:
                  type: object
                  required: [start, end]
                  additionalProperties: false
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                max_rounds: { type: integer, minimum: 1, maximum: 20 }
                min_duration_minutes: { type: integer, minimum: 5, maximum: 1440 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /negotiations/{negotiation_id}:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
    get:
      tags: [negotiations]
      summary: Read negotiation state, filtered to the caller
      description: |
        Returns the state as this caller is permitted to see it. Two participants requesting the
        same negotiation can legitimately receive different documents.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /negotiations/{negotiation_id}/messages:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
    post:
      tags: [negotiations]
      summary: Submit an agent-to-agent message
      description: |
        A malformed envelope is rejected with a structured 400, never a 500. An envelope whose
        intent is outside its scope, or whose scope has expired, is a 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMessage" }
      responses:
        "202":
          description: Accepted and routed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/DisclosureViolation" }

  /negotiations/{negotiation_id}/stream:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
    get:
      tags: [negotiations]
      summary: Server-sent stream of filtered state updates
      description: |
        `text/event-stream`. Two event names, each `data:` line one JSON object.

        - **`state`** — a complete `NegotiationState`, filtered for this caller. Full
          documents rather than patches, so a client that misses an event recovers on the
          next one. `state_version` is monotonic; a client that receives a lower version than
          it already holds discards it, because out-of-order delivery must not roll an
          approval prompt backwards.
        - **`error`** — an RFC 9457 Problem, terminal. Also sent when a grant this stream
          depended on is revoked, which closes the stream immediately rather than letting a
          long-lived connection keep delivering after consent was withdrawn.
      responses:
        "200":
          description: SSE stream of filtered NegotiationState documents
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames as specified above.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /approvals/{approval_id}:
    parameters:
      - name: approval_id
        in: path
        required: true
        schema: { type: string, pattern: "^apr_[A-Za-z0-9]{8,64}$" }
    post:
      tags: [approvals]
      summary: The student confirms or declines on their own behalf
      description: |
        Anything that books, sends or commits passes through here first.

        **What will be revealed is stated before the decision, not after.** The pending approval
        — its id, the action, the disclosure preview and its expiry — is carried in the
        `pending_approvals` array of the negotiation state, which the client reads or streams.
        Describing the consequences only in this endpoint's response would be asking the student
        to consent to something they have not been shown.

        **A human token only.** This is the one place in the API where an agent credential is
        refused outright: the entire approval model rests on a person being on the other end, so
        a token minted for an agent gets a 403 here however broad its grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, state_version]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approve, decline] }
                state_version:
                  type: integer
                  minimum: 0
                  description: |
                    Copied from the `pending_approvals` entry the student was shown. If the
                    negotiation has moved on since, this is a 409 and the client re-reads and
                    re-asks. Without it, approving means approving whatever happens to be
                    current when the request lands, which is not what the student consented to.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NegotiationState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Already decided, expired, or `state_version` is stale. The client re-reads the
            negotiation and asks the student again against the current state.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ---------------------------------------------------------------------------------
  # Track 3 consent, end to end. Four steps, because each answers a different question:
  #
  #   1. POST /channels                      is this a real channel, and is our bot in it?
  #   2. POST /channels/{id}/members         which CampusOS student is which Discord user?
  #   3. POST /negotiations/{id}/channel-bindings
  #                                          may THIS negotiation be discussed in THAT room?
  #      -> raises a post_to_channel approval for every participant, which each human finds
  #         in their own pending_approvals and answers with POST /approvals/{id}
  #   4. GET  /negotiations/{id}/channel-summary   only now does this stop returning 403
  #
  # Step 3 is per-negotiation and cannot be inherited: consenting to a room once is not
  # consenting to every future negotiation in it. Every participant must approve, including
  # one who is not in the channel -- posting about a negotiation discloses their involvement
  # whether or not they can read the room.
  # ---------------------------------------------------------------------------------
  /channels:
    post:
      tags: [channels]
      summary: Register a group chat as a disclosure audience
      description: |
        Track 3 posts into a Discord channel, where the audience is **everyone in the channel**,
        including people who are not in the negotiation. That makes the channel a disclosure
        target in its own right, and it has to be one the backend knows about — otherwise the
        only component that could apply the channel's limit is the bot, and the bot is an
        untrusted client (boundary B1).

        Registering establishes that the channel exists and that our bot is in it. It does **not**
        authorise posting anything: that is per-negotiation, and step 3 above.

        **Authenticated with the bot's service credential**, which is issued out of band and
        bound to one Discord guild. The backend verifies with Discord that the bot is actually a
        member of the channel before accepting; a bot cannot register a room it is not in, and
        cannot register a room in another guild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, platform_channel_id, max_disclosure_level]
              additionalProperties: false
              properties:
                platform: { type: string, enum: [discord] }
                platform_channel_id: { type: string, maxLength: 64 }
                max_disclosure_level:
                  type: string
                  enum: [none, free_busy]
                  description: |
                    Capped at free_busy by the contract, not by convention. `category` and `full`
                    describe why a student is unavailable, and a group chat is the wrong audience
                    for that at any consent level a bot could plausibly collect.
      responses:
        "201":
          description: Registered, pending participant confirmation
          content:
            application/json:
              schema:
                type: object
                required: [channel_id, confirmed]
                additionalProperties: false
                properties:
                  channel_id: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
                  confirmed:
                    type: boolean
                    description: |
                      Always false here, and kept only so the field means one thing everywhere.
                      Registration never authorises posting; consent is per-negotiation and is
                      reported by `GET /negotiations/{id}/channel-bindings`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The bot is not in that channel, or the channel is outside its guild.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /channels/{channel_id}/members:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
    post:
      tags: [channels]
      summary: Link the calling student to their identity in this channel
      description: |
        **Authenticated as the student, with a human token.** Takes no body: the backend uses the
        Discord identity already verified on the caller's account through OAuth, and checks with
        Discord that the identity is a member of this channel.

        Deliberately not a mapping the bot can submit. If the bot could assert "this Discord user
        is that CampusOS student", it could bind a student's data to an account they do not
        control, and every consent decision downstream would be worthless.

        A student who never links is simply never named in the channel. They still get a say in
        whether the negotiation may be discussed there — see step 3.
      responses:
        "204": { description: Linked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The caller has no verified Discord identity, or it is not a member of this channel.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /negotiations/{negotiation_id}/channel-bindings:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
    post:
      tags: [channels]
      summary: Ask to discuss this negotiation in a registered channel
      description: |
        **Authenticated as a participant, with a human token.** Raises a `post_to_channel`
        approval for **every participant**, which each of them finds in their own
        `pending_approvals` and answers through `POST /approvals/{id}` — the same human-only
        path as every other approval, carrying the same disclosure preview. There is no
        channel-specific consent mechanism, deliberately: one approval surface means one place
        where consent can be got wrong.

        Participants who are not channel members are included. Posting about a negotiation
        reveals that they are in it, and whether they can read the room does not change that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              additionalProperties: false
              properties:
                channel_id: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
      responses:
        "201":
          description: Requested; approvals raised
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [channels]
      summary: Whether this negotiation may be discussed in a channel yet
      description: |
        How confirmation becomes observable. Reports counts, never individual decisions: who
        declined is their business, and surfacing it would turn a private no into social
        pressure inside the very room the decision is about.
      responses:
        "200":
          description: Current bindings for this negotiation
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                additionalProperties: false
                properties:
                  bindings:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelBinding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /negotiations/{negotiation_id}/channel-bindings/{channel_id}:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
      - name: channel_id
        in: path
        required: true
        schema: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
    delete:
      tags: [channels]
      summary: Withdraw consent to discuss this negotiation in this channel
      description: |
        Any participant, for their own consent, at any time — including after the binding was
        confirmed and summaries have already been posted. One withdrawal revokes the binding for
        everyone, because the audience cannot be partially un-told. Already-posted messages stay
        posted; the summary endpoint returns 403 from here on.
      responses:
        "204": { description: Withdrawn; the summary endpoint returns 403 from now on }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /negotiations/{negotiation_id}/channel-summary:
    parameters:
      - name: negotiation_id
        in: path
        required: true
        schema: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
      - name: channel_id
        in: query
        required: true
        schema: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
    get:
      tags: [channels]
      summary: The channel-safe view of a negotiation
      description: |
        What the Track 3 bot posts, computed server-side for the channel's audience. The bot
        renders this and nothing else; it never reads `NegotiationState` and never decides what
        is safe to say. That is the whole point — a participant-filtered document is not
        authorisation to broadcast it to a room, and the two had been conflated.
      responses:
        "200":
          description: Safe to post in the channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            No confirmed binding for this negotiation and channel. Covers every reason: never
            requested, still `pending_consent`, `declined`, `withdrawn`, or `pending_reconsent`
            because the audience changed. The body does not say which — a bot that learned "declined"
            rather than "pending" would be able to report a private no into the channel.

            **This is the missing-consent rejection.** The bot's only correct response is to say
            nothing about the negotiation.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /grants:
    post:
      tags: [grants]
      summary: Grant another student's agent scoped, expiring access
      description: |
        The only way cross-student reads happen. Every grant is explicit, scoped to one
        negotiation, time-limited, and written to the audit log. There is no implicit sharing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [negotiation_id, grantee_agent_id, max_disclosure_level, expires_at]
              additionalProperties: false
              properties:
                negotiation_id: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
                grantee_agent_id: { type: string, pattern: "^agt_[A-Za-z0-9]{16,64}$" }
                max_disclosure_level: { type: string, enum: [none, free_busy, category, full] }
                expires_at: { type: string, format: date-time }
      responses:
        "201":
          description: Granted and audited
          content:
            application/json:
              schema:
                type: object
                required: [grant_id, expires_at]
                properties:
                  grant_id: { type: string, pattern: "^grt_[A-Za-z0-9]{8,64}$" }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /grants/{grant_id}:
    parameters:
      - name: grant_id
        in: path
        required: true
        schema: { type: string, pattern: "^grt_[A-Za-z0-9]{8,64}$" }
    delete:
      tags: [grants]
      summary: Revoke a grant before it expires
      description: |
        Only the student who issued it. A grant that can be given and not taken back is not a
        grant, it is a disclosure with a timer, and "I changed my mind" is the most ordinary
        privacy action there is.

        Revocation takes effect immediately and applies to **open streams as well as new
        requests**: any `/stream` subscription relying on this grant is dropped, and whatever
        was already delivered stays delivered. Saying so here matters because the natural
        implementation — checking the grant when the stream opens — silently keeps leaking to a
        long-lived connection after the student has revoked it.
      responses:
        "204": { description: Revoked; open streams relying on it are dropped }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Identity is derived from this token and from nothing else. No endpoint accepts a
        client-supplied user id as proof of who the caller is.

  schemas:
    Availability:
      $ref: "https://campusos.dev/contracts/v1/availability.schema.json"
    AgentMessage:
      $ref: "https://campusos.dev/contracts/v1/agent-protocol.schema.json"
    NegotiationState:
      $ref: "https://campusos.dev/contracts/v1/negotiation-state.schema.json"
    ChannelBinding:
      type: object
      description: |
        Whether one negotiation may be discussed in one channel. Counts only — never which
        participant decided what.
      required: [channel_id, negotiation_id, status, confirmations_outstanding, max_disclosure_level]
      additionalProperties: false
      properties:
        channel_id: { type: string, pattern: "^chn_[A-Za-z0-9]{8,64}$" }
        negotiation_id: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
        status:
          description: |
            `pending_consent`: approvals are out. `confirmed`: every participant approved, and
            the summary endpoint serves. `declined`: at least one said no. `withdrawn`: consent
            was taken back. `pending_reconsent`: the channel's verified membership *changed*
            since consent was given — anyone joined, anyone left, or one account replaced
            another — so the audience is no longer the one anybody agreed to.
          enum: [pending_consent, confirmed, declined, withdrawn, pending_reconsent]
        confirmations_outstanding:
          type: integer
          minimum: 0
          description: How many participants have not yet answered. Zero with status `pending_consent` is impossible.
        max_disclosure_level:
          type: string
          enum: [none, free_busy]
        audience_size_at_consent:
          type: integer
          minimum: 0
          description: |
            How many accounts could read the channel when consent was given. Reported for the
            student's benefit; it is **not** what the gate compares. The backend records a
            one-way, channel-scoped digest of *which* accounts those were, and re-checks that
            on every summary read: any change moves the binding to `pending_reconsent` and the
            summary endpoint returns 403 until the participants agree again. Consent is to an
            audience, not to a name and not to a headcount — a room that swaps one member for
            another is a different audience at the same size. The digest is never published
            here: a count tells a student how far their words travel, while the identities
            behind it are the room's business and not the negotiation's.
        confirmed_at: { type: string, format: date-time }

    ChannelSummary:
      type: object
      description: |
        The only shape the Track 3 bot ever posts. Small on purpose -- it is written for a room,
        not for a participant. There is no availability envelope here at any level: a channel
        never needs to know when anyone is busy, only whether a time was found.

        **There is no free text.** An earlier version carried a server-composed `text` string,
        which meant the one sentence that reaches a group chat was the one thing no schema could
        check -- it rested entirely on the backend never composing a careless sentence. Instead
        the server picks a `template_id` from a closed list and the bot renders it from the
        typed fields here. A template is a constant in both codebases; the slots are integers
        and a timestamp. Neither side can emit a sentence nobody wrote in advance, and an LLM
        is never in this path.

        **The exact templates.** Both T2 and T9 implement this table verbatim, so the rendered
        output is identical whoever renders it:

        | `template_id` | Rendered | Slots used |
        |---|---|---|
        | `gathering_availability` | "Collecting availability from {participant_count} people." | `participant_count` |
        | `proposal_on_table` | "There's a time on the table -- round {round} of {max_rounds}." | `round`, `max_rounds` |
        | `awaiting_approvals` | "Waiting on everyone to confirm." | -- |
        | `converged` | "Locked in: {agreed_slot}." | `agreed_slot` |
        | `failed_no_overlap` | "No time works for everyone in this window." | -- |
        | `failed_max_rounds` | "No time found in {max_rounds} rounds -- over to you." | `max_rounds` |
        | `expired` | "This one timed out." | -- |
        | `cancelled` | "Someone withdrew, so this is off." | -- |
        | `consent_withdrawn` | "I've been asked to stop posting about this one." | -- |

        `{agreed_slot}` is formatted from the timestamps in the channel's own timezone. No
        template interpolates a name, a label, a category, a reason or any free string, and
        there is deliberately no `other` or `custom` id: an escape hatch here would be the
        whole hole reopened.

        **No participant names.** A previous draft carried consented display names. The room
        already knows who is in it, and a name in a summary tells non-participants who is
        negotiating with whom. Dropped rather than gated.
      required: [negotiation_id, status, round, max_rounds, template_id, participant_count]
      additionalProperties: false
      properties:
        negotiation_id: { type: string, pattern: "^neg_[A-Za-z0-9]{16,64}$" }
        status:
          type: string
          enum: [gathering, negotiating, awaiting_approval, converged, failed, expired, cancelled]
        round: { type: integer, minimum: 0 }
        max_rounds: { type: integer, minimum: 1, maximum: 20 }
        template_id:
          description: Which allowlisted sentence to render. Closed, and deliberately without an escape hatch.
          type: string
          enum:
            - gathering_availability
            - proposal_on_table
            - awaiting_approvals
            - converged
            - failed_no_overlap
            - failed_max_rounds
            - expired
            - cancelled
            - consent_withdrawn
        participant_count:
          type: integer
          minimum: 2
          maximum: 12
          description: How many people are negotiating. A count, never who.
        agreed_slot:
          type: object
          description: Present only with template_id `converged`. A time, never a reason.
          required: [start, end]
          additionalProperties: false
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        timezone:
          type: string
          minLength: 3
          description: IANA zone the bot formats agreed_slot in, so the room sees its own local time.
      allOf:
        - if:
            properties: { template_id: { const: converged } }
            required: [template_id]
          then:
            required: [agreed_slot, timezone]

    Problem:
      type: object
      description: RFC 9457 problem details. Never contains private data or a secret.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }

  responses:
    BadRequest:
      description: Malformed request or envelope. Structured, never a 500.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Authenticated but not permitted: no grant, scope expired, or intent outside scope.
        The body never reveals whether the resource exists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource, or the caller may not know it exists.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DisclosureViolation:
      description: |
        The payload exceeds the disclosure level in force. Returned instead of silently
        redacting, so that an over-disclosing client is a loud failure in tests rather than a
        quiet leak in production.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
