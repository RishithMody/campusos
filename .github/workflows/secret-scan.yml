name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all tracked files
        run: ./scripts/ci/secret_scan.sh --tracked

      # The scan above is a deliberately dependency-free safety net, not a full scanner.
      # For stronger coverage, add gitleaks or trufflehog here once the repo settles.
      - name: Note on coverage
        if: always()
        run: |
          echo "::notice::secret_scan.sh is a basic pattern net. Consider adding gitleaks for history scanning."
