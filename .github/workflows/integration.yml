name: Integration (mocks)

# End-to-end and integration tests, run entirely against MOCKS.
#
# This workflow must never need a GPU, an H200, or cluster credentials. Tests that
# require real inference are marked @pytest.mark.gpu and excluded here; they are run
# manually under the approval rules in docs/infra-policy.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      # These are the names the application actually reads (backend/config.py and
      # backend/db/migrations/env.py). `DATABASE_URL`/`REDIS_URL` were set here before
      # T2 landed, and the migration step failed with KeyError: 'CAMPUSOS_DATABASE_URL'.
      # The driver prefix matters too: the project uses psycopg 3, not psycopg2.
      CAMPUSOS_INFERENCE_MODE: mock
      CAMPUSOS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campusos_test
      CAMPUSOS_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Detect integration tests
        id: detect
        run: |
          if [ -d tests/integration ] || [ -d tests/e2e ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No integration tests yet (T7 has not landed). Nothing to run."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: '3.11'

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # groupchat/requirements-dev.txt pulls in backend/requirements-dev.txt, which
          # pulls in backend/requirements.txt. The privacy suite below collects the whole
          # tests/ tree, including the groupchat tests, so discord.py and fakeredis have
          # to be present or collection fails before a single assertion runs.
          for req in groupchat/requirements-dev.txt backend/requirements-dev.txt \
                     backend/requirements.txt; do
            if [ -f "$req" ]; then pip install -r "$req"; break; fi
          done

      - name: Migrations
        if: steps.detect.outputs.found == 'true'
        run: |
          if [ -f backend/alembic.ini ]; then
            cd backend && alembic upgrade head
          else
            echo "::notice::no alembic config yet"
          fi

      - name: Integration tests (mocks only, no GPU)
        if: steps.detect.outputs.found == 'true'
        run: |
          ran=0
          if [ -d tests/integration ]; then
            pytest tests/integration -v -m 'not gpu'
            ran=1
          fi
          if [ -d tests/e2e ]; then
            pytest tests/e2e -v -m 'not gpu'
            ran=1
          fi
          if [ "$ran" = "0" ]; then echo "::notice::no integration or e2e tests present"; fi

      - name: Privacy and authorization suite
        if: steps.detect.outputs.found == 'true'
        run: |
          # The highest-value tests in this project: they defend the product's core promise.
          if pytest --collect-only -q -m privacy >/dev/null 2>&1; then
            pytest -v -m 'privacy and not gpu'
          else
            echo "::notice::no tests marked 'privacy' yet — T2 and QA must add them"
          fi
