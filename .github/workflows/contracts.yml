name: Contracts & orchestration

# Validates the shared agent protocol / API contracts, and sanity-checks the
# orchestration tooling itself. These contracts are what lets three memory-less
# agents build compatible code in parallel, so they are worth a gate of their own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract validation dependencies
        # All three are required once contracts/ is populated. The validator treats a
        # missing dependency as a hard FAIL rather than a silent skip, so installing
        # only PyYAML -- as this step did before T1 landed real schemas -- fails the
        # job while reporting that nothing was checked.
        run: pip install pyyaml jsonschema openapi-spec-validator

      - name: Validate agent protocol and API contracts
        run: ./scripts/ci/validate_contracts.py --strict

      - name: Shell syntax check
        run: |
          fail=0
          for f in scripts/agents.sh scripts/ci/*.sh scripts/demo/*.sh .githooks/*; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "ok   $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/agents.sh scripts/ci/*.sh scripts/demo/*.sh .githooks/*

      - name: Orchestration files present
        run: |
          fail=0
          for f in CLAUDE.md AGENTS.md docs/task-graph.md docs/infra-policy.md \
                   docs/agents/status.md docs/reviews/TEMPLATE.md \
                   docs/agents/handoffs/TEMPLATE.md docs/agents/assignments/TEMPLATE.md; do
            if [ -f "$f" ]; then echo "ok   $f"; else echo "MISSING $f"; fail=1; fi
          done
          for r in orchestrator backend-engineer ml-engineer gpu-infra-engineer \
                   frontend-engineer qa-security-reviewer; do
            if [ -f "docs/agents/roles/$r.md" ]; then echo "ok   role $r"; else
              echo "MISSING role $r"; fail=1; fi
          done
          exit $fail

      - name: Orchestration tooling regression tests
        run: ./scripts/ci/test_agents_sh.sh

      - name: Hooks are executable
        run: |
          fail=0
          for h in pre-commit pre-merge-commit post-merge pre-push; do
            if [ -x ".githooks/$h" ]; then echo "ok   $h"; else
              echo "NOT EXECUTABLE .githooks/$h"; fail=1; fi
          done
          exit $fail
