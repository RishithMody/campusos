name: TypeScript

# Lint and type-check the Next.js frontend. Runs only once frontend/ exists (T5).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet (T5 has not landed). Nothing to check."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npx eslint .

      - name: Tests
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: |
          if npm run | grep -qE '^  test'; then npm test -- --run 2>/dev/null || npm test; else
            echo "::notice::no test script defined in frontend/package.json"
          fi

      - name: Build
        if: steps.detect.outputs.found == 'true'
        working-directory: frontend
        run: npm run build
